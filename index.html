
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wins Garden Carboot Booking</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f3;font-family:Arial,sans-serif;color:#193c2a}
header{background:#174a32;color:white;text-align:center;padding:25px 12px}
h1{font-size:25px;margin:0 0 10px}
main{max-width:650px;margin:auto;padding:15px}
section{background:white;padding:20px;margin-bottom:15px;border-radius:15px}
input,button{font-size:16px;padding:12px;border-radius:8px}
input{width:100%;border:1px solid #ccc;margin:6px 0 15px}
label{font-weight:bold}
#lots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lot{background:#d5f5df;border:1px solid #44a267;color:#185c35;font-weight:bold}
.lot:disabled{background:#f8d8d8;color:#a22;border-color:#e99}
.lot.selected{background:#155b39;color:white}
#submit{background:#155b39;color:white;border:0;width:100%;font-weight:bold;margin-top:12px}
#submit:disabled{opacity:.5}
#message{white-space:pre-line;line-height:1.7;margin-top:15px;overflow-wrap:anywhere}
small{color:#667}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<header>
<h1>🚗 WINS GARDEN CARBOOT</h1>
<div>LOT 01–47 | RM10 / DAY</div>
</header>
<main>
<section>
<h2>Choose Booking Date</h2>
<input type="date" id="date">
<p>🟢 Available　🔴 Booked</p>
<div id="lots"></div>
<p id="selected">Loading...</p>
</section>
<section>
<h2>Customer Details</h2>
<form id="form">
<label>Full Name *</label>
<input id="name" required maxlength="100">
<label>Phone Number *</label>
<input id="phone" type="tel" required minlength="9" maxlength="30">
<label>Car Plate</label>
<input id="plate" maxlength="30">
<label>Items for Sale</label>
<input id="goods" maxlength="150">
<p><small>RM10 per LOT per day. Payment instructions will be provided separately.</small></p>
<h3>Security Verification</h3>
<div class="cf-turnstile"
 data-sitekey="0x4AAAAAAFNhUUe8cHHEhtCh">
</div>
<button id="submit" type="submit">
CONFIRM BOOKING
</button>
</form>
<div id="message" role="status"></div>
</section>
</main>
<script>
const BASE="https://ztgbctiznyvaoeqewpya.supabase.co";
const KEY="sb_publishable_qXzgK-lh9QMFuigKmjdIjg_u2Cksq9c";
const ENDPOINT=BASE+"/functions/v1/carboot-book";
const $=id=>document.getElementById(id);
let chosen=null,booked=new Set(),seq=0;
const pad=n=>String(n).padStart(2,"0");

function malaysiaDate(add=0){
 const d=new Date(Date.now()+add*86400000);
 const parts=new Intl.DateTimeFormat("en-GB",{
  timeZone:"Asia/Kuala_Lumpur",
  year:"numeric",month:"2-digit",day:"2-digit"
 }).formatToParts(d);
 const value=t=>parts.find(x=>x.type===t).value;
 return value("year")+"-"+value("month")+"-"+value("day");
}

$("date").min=malaysiaDate();
$("date").max=malaysiaDate(90);
$("date").value=malaysiaDate();

function draw(){
 $("lots").replaceChildren();
 for(let i=1;i<=47;i++){
  const b=document.createElement("button");
  b.type="button";
  b.className="lot"+(chosen===i?" selected":"");
  b.textContent="LOT "+pad(i);
  b.disabled=booked.has(i);
  b.onclick=()=>{chosen=i;draw();};
  $("lots").appendChild(b);
 }
 $("selected").textContent=chosen
  ?"Selected LOT "+pad(chosen)+" — RM10"
  :"Please select an available LOT.";
}

async function loadLots(){
 const current=++seq;
 chosen=null;
 booked=new Set();
 $("lots").replaceChildren();
 $("selected").textContent="Loading availability...";
 try{
  const response=await fetch(BASE+"/rest/v1/rpc/carboot_taken",{
   method:"POST",
   headers:{
    apikey:KEY,
    "Content-Type":"application/json"
   },
   body:JSON.stringify({p_date:$("date").value})
  });
  if(!response.ok)throw Error("Cannot check LOTs");
  const rows=await response.json();
  if(current!==seq)return;
  booked=new Set(rows.map(x=>Number(x.lot)));
  draw();
 }catch(e){
  if(current!==seq)return;
  $("selected").textContent="Cannot load LOTs. Please refresh.";
 }
}

$("date").addEventListener("change",loadLots);

$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!chosen){
  alert("Please select a LOT.");
  return;
 }
 const token=window.turnstile?.getResponse();
 if(!token){
  alert("Please complete security verification.");
  return;
 }
 const button=$("submit");
 button.disabled=true;
 button.textContent="Submitting...";
 $("message").textContent="";
 const date=$("date").value,lot=chosen;
 try{
  const response=await fetch(ENDPOINT,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    apikey:KEY
   },
   body:JSON.stringify({
    date,lot,
    name:$("name").value.trim(),
    phone:$("phone").value.trim(),
    plate:$("plate").value.trim(),
    goods:$("goods").value.trim(),
    turnstileToken:token
   })
  });
  const result=await response.json();
  if(!response.ok){
   throw Error(result.error||"Booking failed");
  }
  $("message").textContent=
   "✅ BOOKING RECEIVED!\nDate: "+date+
   "\nLOT "+pad(lot)+
   "\nPlease screenshot this confirmation.";
  $("form").reset();
  await loadLots();
 }catch(err){
  $("message").textContent="Booking unsuccessful: "+err.message;
 }finally{
  window.turnstile?.reset();
  button.disabled=false;
  button.textContent="CONFIRM BOOKING";
 }
});
loadLots();
</script>
</body>
</html>
