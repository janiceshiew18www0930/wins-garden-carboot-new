<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wins Garden Password Reset</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f6f3;margin:0;color:#193c2a}
header{background:#174a32;color:white;text-align:center;padding:25px}
main{max-width:450px;margin:25px auto;background:white;padding:24px;border-radius:15px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
button{background:#155b39;color:white;border:0}
button:disabled{opacity:.5}
#msg{overflow-wrap:anywhere;line-height:1.6}
</style>
</head>
<body>
<header><h2>WINS GARDEN CARBOOT</h2><p>ADMIN PASSWORD RESET</p></header>
<main>
<h3>Set New Password</h3>
<input id="password" type="password" placeholder="New password (8+ characters)">
<input id="confirm" type="password" placeholder="Confirm password">
<button id="save" disabled>Checking reset link...</button>
<p id="msg">Please wait...</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const BASE="https://ztgbctiznyvaoeqewpya.supabase.co";
const KEY="sb_publishable_qXzgK-lh9QMFuigKmjdIjg_u2Cksq9c";
const msg=document.getElementById("msg");
const btn=document.getElementById("save");
let client;
async function start(){
 try{
  client=window.supabase.createClient(BASE,KEY,{
   auth:{detectSessionInUrl:true,persistSession:true}
  });
  const q=new URLSearchParams(location.search);
  const h=new URLSearchParams(location.hash.slice(1));
  const error=q.get("error_description")||h.get("error_description");
  if(error)throw Error(error);
  if(q.get("token_hash")&&q.get("type")==="recovery"){
   const r=await client.auth.verifyOtp({
    token_hash:q.get("token_hash"),type:"recovery"
   });
   if(r.error)throw r.error;
  }
  const r=await client.auth.getSession();
  if(r.error)throw r.error;
  if(!r.data.session)throw Error("Reset link expired or invalid. Please request another email.");
  btn.disabled=false;
  btn.textContent="SAVE NEW PASSWORD";
  msg.textContent="Ready. Enter your new password.";
 }catch(e){msg.textContent=e.message;}
}
btn.onclick=async()=>{
 const p=document.getElementById("password").value;
 const c=document.getElementById("confirm").value;
 if(p.length<8){msg.textContent="Use at least 8 characters.";return;}
 if(p!==c){msg.textContent="Passwords do not match.";return;}
 btn.disabled=true;
 msg.textContent="Saving...";
 const r=await client.auth.updateUser({password:p});
 if(r.error){
  msg.textContent=r.error.message;
  btn.disabled=false;
 }else{
  await client.auth.signOut();
  msg.innerHTML='Password changed successfully. <a href="/admin.html">Go to Admin Login</a>';
 }
};
start();
</script>
</body>
</html>
